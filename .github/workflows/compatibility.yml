name: Database compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      scriptella_version:
        description: Scriptella version to test
        required: false
        default: '1.5'

permissions:
  contents: read

jobs:
  compatibility:
    name: Database compatibility / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mariadb, oracle, mssql]

    # If heavy jobs become too slow or expensive, keep PostgreSQL and MariaDB
    # on the normal PR path and move Oracle/SQL Server to a narrower trigger.
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run database compatibility test
        run: ./run-db-test.sh "${{ matrix.database }}" "-Dscriptella.version=${SCRIPTELLA_VERSION}"
        env:
          SCRIPTELLA_VERSION: ${{ inputs.scriptella_version || '1.5' }}

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.database }}
          path: reports/${{ matrix.database }}.log
          if-no-files-found: ignore
