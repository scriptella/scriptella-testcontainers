# Pinned Testcontainers images for the initial public compatibility suite.
# Keep patch-level tags so a test run is reproducible and refresh pins deliberately.
# Prefer the smallest official flavor that retains the relational and JDBC behavior under test.
postgresql.image=postgres:17.11-alpine3.24
mariadb.image=mariadb:11.8.8
oracle.image=gvenzl/oracle-free:23.26.2-slim-faststart
mssql.image=mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
